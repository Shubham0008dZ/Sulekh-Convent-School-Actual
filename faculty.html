<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty & Staff – Sulekh Convent School, Bareilly</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/faculty.css" />
</head>
<body>
<div id="navbar-container"></div>

<section class="page-banner">
  <div class="container">
    <h1>Faculty & Staff</h1>
    <div class="breadcrumb"><a href="index.html">Home</a><span>›</span><span>Faculty</span></div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="section-header">
      <span class="badge">Our Team</span>
      <h2>Meet Our Dedicated Faculty</h2>
      <p>Experienced, passionate educators committed to bringing out the best in every student.</p>
    </div>

    <!-- Filter buttons -->
    <div class="faculty-filters" id="facultyFilters">
      <button class="filter-btn active" data-filter="all">All Staff</button>
      <button class="filter-btn" data-filter="Administration">Administration</button>
      <button class="filter-btn" data-filter="Science">Science</button>
      <button class="filter-btn" data-filter="Mathematics">Mathematics</button>
      <button class="filter-btn" data-filter="Languages">Languages</button>
      <button class="filter-btn" data-filter="Social Science">Social Science</button>
      <button class="filter-btn" data-filter="Sports">Sports & Arts</button>
    </div>

    <button class="btn-add-new" onclick="openAddFacultyModal()"><i class="fas fa-plus"></i> Add Faculty Member</button>

    <div class="faculty-grid" id="facultyGrid">
      <div class="loader"><div class="spinner"></div></div>
    </div>
  </div>
</section>

<div id="footer-container"></div>
<script src="js/global.js"></script>
<script src="js/faculty.js"></script>
</body>
</html>
