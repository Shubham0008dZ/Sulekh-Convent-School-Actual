<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – Sulekh Convent School</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/admin-login.css" />
</head>
<body class="login-page">

<div class="login-wrapper">
  <!-- Left panel -->
  <div class="login-left">
    <div class="login-left-content">
      <div class="school-emblem">
        <div class="emblem-ring">
          <span>SC</span>
        </div>
      </div>
      <h1>Sulekh Convent School</h1>
      <p>Bareilly, Uttar Pradesh</p>
      <div class="login-features">
        <div class="lf-item"><i class="fas fa-shield-alt"></i> Secure Admin Access</div>
        <div class="lf-item"><i class="fas fa-edit"></i> Manage All Content</div>
        <div class="lf-item"><i class="fas fa-sync-alt"></i> Real-time Updates</div>
        <div class="lf-item"><i class="fas fa-table"></i> Google Sheet Backend</div>
      </div>
    </div>
    <div class="login-left-decoration"></div>
  </div>

  <!-- Right panel: Login form -->
  <div class="login-right">
    <div class="login-card">
      <div class="login-header">
        <div class="lock-icon"><i class="fas fa-lock"></i></div>
        <h2>Admin Login</h2>
        <p>Enter your credentials to access the admin panel</p>
      </div>

      <div id="loginError" class="login-error" style="display:none;"></div>

      <div class="login-form" id="loginForm">
        <div class="form-group">
          <label for="username"><i class="fas fa-user"></i> Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password"><i class="fas fa-lock"></i> Password</label>
          <div class="password-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button class="btn-login" id="loginBtn" onclick="handleLogin()">
          <span id="loginBtnText"><i class="fas fa-sign-in-alt"></i> Login</span>
          <span id="loginBtnLoader" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Logging in...</span>
        </button>
      </div>

      <div class="login-footer">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Website</a>
        <span class="sep">|</span>
        <span>Contact admin for credentials</span>
      </div>
    </div>
  </div>
</div>

<script src="js/global.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
