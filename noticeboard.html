<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notice Board – Sulekh Convent School, Bareilly</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/noticeboard.css" />
</head>
<body>
<div id="navbar-container"></div>

<section class="page-banner">
  <div class="container">
    <h1>Notice Board</h1>
    <div class="breadcrumb"><a href="index.html">Home</a><span>›</span><span>Notice Board</span></div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="section-header">
      <span class="badge">Announcements</span>
      <h2>Latest Notices & Circulars</h2>
      <p>All important announcements, exam schedules, events, and circulars for students and parents.</p>
    </div>

    <!-- Search & Filter Bar -->
    <div class="notice-toolbar">
      <div class="notice-search">
        <i class="fas fa-search"></i>
        <input type="text" id="noticeSearch" placeholder="Search notices..." oninput="filterNotices()" />
      </div>
      <div class="notice-cat-filters" id="noticeCatFilters">
        <button class="filter-btn active" data-cat="all">All</button>
        <button class="filter-btn" data-cat="General">General</button>
        <button class="filter-btn" data-cat="Exam">Exam</button>
        <button class="filter-btn" data-cat="Holiday">Holiday</button>
        <button class="filter-btn" data-cat="Event">Event</button>
        <button class="filter-btn" data-cat="Admission">Admission</button>
        <button class="filter-btn" data-cat="Fee">Fee</button>
      </div>
    </div>

    <button class="btn-add-new" onclick="openAddNoticeModal()"><i class="fas fa-plus"></i> Add Notice</button>

    <div id="noticeList">
      <div class="loader"><div class="spinner"></div></div>
    </div>
  </div>
</section>

<div id="footer-container"></div>
<script src="js/global.js"></script>
<script src="js/noticeboard.js"></script>
</body>
</html>
